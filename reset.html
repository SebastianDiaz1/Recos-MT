<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1a2a">
<title>Nueva contraseña · Reconectadores MT</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,#0c1928,#154d7d);display:grid;place-items:center;padding:20px;color:#172033}.card{width:min(100%,440px);background:#fff;border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.28)}.logo{width:58px;height:58px;border-radius:17px;background:#eaf2ff;display:grid;place-items:center;font-size:28px;margin-bottom:16px}h1{margin:0 0 8px;font-size:25px}.muted{color:#6d7788;font-size:13px;line-height:1.5;margin-bottom:20px}label{display:block;font-size:12px;font-weight:800;color:#596579;margin:12px 0 5px}input{width:100%;padding:13px 12px;border:1px solid #dce3ec;border-radius:11px;font-size:16px}.btn{width:100%;border:0;border-radius:11px;padding:13px 15px;font-weight:900;font-size:15px;cursor:pointer;margin-top:14px;background:#1559c9;color:#fff}#msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center}.ok{color:#0f8a5f}.err{color:#b73932}
</style>
</head>
<body>
<div class="card">
 <div class="logo">🔐</div>
 <h1>Nueva contraseña</h1>
 <p class="muted">Define una nueva contraseña para tu acceso de administrador.</p>
 <label for="p1">Nueva contraseña</label>
 <input id="p1" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
 <label for="p2">Repetir contraseña</label>
 <input id="p2" type="password" autocomplete="new-password" placeholder="Repite la contraseña">
 <button class="btn" id="saveBtn">Guardar nueva contraseña</button>
 <div id="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://aoskcafxlvwsjntnmqtb.supabase.co','sb_publishable_yraJ23uSvq02pf2X46Foyg_QvnSg62T');
const msg=document.getElementById('msg');function show(t,c=''){msg.textContent=t;msg.className=c}
async function save(){const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1.length<8){show('La contraseña debe tener al menos 8 caracteres.','err');return}if(p1!==p2){show('Las contraseñas no coinciden.','err');return}const {error}=await sb.auth.updateUser({password:p1});if(error){console.error(error);show('No se pudo cambiar la contraseña. Abre nuevamente el enlace de recuperación.','err');return}show('Contraseña actualizada correctamente.','ok');setTimeout(()=>location.href='admin.html',900)}
document.getElementById('saveBtn').addEventListener('click',save);
</script>
</body>
</html>
