name: Build PWA icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "icons/reco-app.svg"
      - ".github/workflows/build-pwa-icons.yml"

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Render PWA icons
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from pathlib import Path

          src = "icons/reco-app.svg"
          outputs = {
              "icons/icon-192.png": 192,
              "icons/icon-512.png": 512,
              "icons/apple-touch-icon.png": 180,
          }
          for path, size in outputs.items():
              cairosvg.svg2png(url=src, write_to=path, output_width=size, output_height=size)
              im = Image.open(path).convert("RGBA")
              im.save(path, optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate PWA PNG icons from approved branding"
          git push
